schema: spec-driven
githubCopilot:
  cloudAgent: true

context: |
  Project: Blueprint BI / ChatInsights

  Purpose:
  AI-powered business intelligence system that transforms
  WhatsApp customer conversations into structured business
  information and actionable insights for small and independent
  businesses.

  MVP domain:
  Sri Lankan home bakery.

  MVP data source:
  WhatsApp exported chat ZIP files.
  Direct WhatsApp API integration is NOT part of the MVP.

  Backend:
  Python + FastAPI.

  Frontend:
  Next.js.

  Database:
  SQLite + SQLAlchemy.

  Agent:
  LangGraph / LangChain.

  Development approach:
  Specification-Driven Development using OpenSpec.

  MVP duration:
  Three weeks.

  Core MVP workflow:
  WhatsApp ZIP ingestion
  → parsing
  → normalization
  → business relevance detection
  → AI extraction
  → structured database
  → analytics
  → AI business assistant.

  Important principles:
  - Preserve raw conversation data.
  - Keep AI-derived data separate from raw data.
  - AI-derived facts should retain source message references.
  - Use database/analytics tools for quantitative questions.
  - Use LLMs for language understanding and interpretation.
  - Do not build direct WhatsApp API integration in the MVP.
  - Do not over-engineer advanced video processing.
  - Personal conversations should not unnecessarily contribute
    to business analytics.
  - New WhatsApp identities should initially remain separate
    unless there is sufficient evidence to link them.
  - AI should not silently fabricate business facts.
  - Uncertain important information should support human review.