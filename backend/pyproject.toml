[project]
name = "blueprint-bi-backend"
version = "0.1.0"
description = "Blueprint BI LangGraph agent"
requires-python = ">=3.12,<3.13"

dependencies = [
    "langgraph>=1.2,<2",
    "langchain-core>=1.5,<2",
    "langchain-google-genai>=4.3,<5",
    "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
# `langgraph dev` lives here, not in the runtime deps -- LangGraph Platform
# supplies its own server, so shipping the CLI to prod is dead weight.
dev = [
    "langgraph-cli[inmem]>=0.4,<0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
